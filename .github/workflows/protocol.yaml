---
name: 🔗 Protocol

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/protocol.yaml
      - protocol/**
      - scripts/protocol-check.sh
  pull_request:
    paths:
      - .github/workflows/protocol.yaml
      - protocol/**
      - scripts/protocol-check.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    name: 🔗 Schema matches its tag in kloudkit/hubd
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔗 Compare protocol/client.schema.json with protocol/TAG
        run: scripts/protocol-check.sh
