---
name: 🚀 Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: 🧪 CI
    uses: ./.github/workflows/ci.yaml

  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs:
      - ci

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔵 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 📝 Extract release notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "${{ runner.temp }}/notes.md"
          test -s "${{ runner.temp }}/notes.md"

      - name: 📦 Build a draft release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔏 Sign the manifest
        env:
          KEY: ${{ secrets.KEY__HUBRIDGE_RELEASE }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key.pem"
          test "$(openssl pkey -in "$RUNNER_TEMP/key.pem" -pubout -outform DER | tail -c 32 | base64 -w0)" = "$(sed -n 's/^var PublicKey = "\(.*\)"$/\1/p' internal/update/update.go)"
          protocol=$(go list -m -f '{{.Version}}' github.com/kloudkit/hubd/protocol | cut -d. -f1 | tr -d v)
          jq -Rn --arg v "$GITHUB_REF_NAME" --argjson p "$protocol" \
            '{version: $v, protocol: $p, assets: ([inputs | split("  ") | {(.[1]): .[0]}] | add)}' < dist/checksums.txt > dist/manifest.json
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in dist/manifest.json | base64 -w0 > dist/manifest.json.sig
          rm "$RUNNER_TEMP/key.pem"

      - name: 🔖 Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/manifest.json dist/manifest.json.sig
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
