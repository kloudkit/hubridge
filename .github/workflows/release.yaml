---
name: 🚀 Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: 🧪 CI
    uses: ./.github/workflows/ci.yaml

  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs:
      - ci

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔵 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 📝 Extract release notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "${{ runner.temp }}/notes.md"
          test -s "${{ runner.temp }}/notes.md"

      - name: 📦 Build a draft release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔏 Sign the manifest
        env:
          HUBRIDGE_SIGNING_KEY: ${{ secrets.KEY__HUBRIDGE_RELEASE }}
        run: go run ./tools/release manifest --checksums dist/checksums.txt --version "$GITHUB_REF_NAME" --out dist/manifest.json

      - name: 🔖 Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/manifest.json dist/manifest.json.sig
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
